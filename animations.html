<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paystiker — Интерактивные варианты презентации кэшбэк-системы</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .device-mobile {
      width: 412px;
      height: 840px;
      border-radius: 40px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 12px #1e293b;
      margin: 20px auto;
      overflow: hidden;
      border: 4px solid #0f172a;
      transition: all 0.3s ease;
    }
    .device-desktop {
      width: 100%;
      height: calc(100vh - 130px);
      border-radius: 12px;
      border: 1px solid #1e293b;
      margin: 0;
      transition: all 0.3s ease;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0f172a;
    }
  </style>
</head>
<body class="bg-[#0B0F19] text-slate-100 antialiased min-h-screen flex flex-col">

  <!-- Header Bar -->
  <header class="bg-[#070A12] border-b border-slate-800 px-4 py-3 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between flex-wrap gap-3">
      
      <!-- Brand -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-indigo-500/20">
          P
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-white text-base">Paystiker</span>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">Кэшбэк & Промо</span>
          </div>
          <p class="text-xs text-slate-400">Презентации и интерактивные анимации</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex items-center gap-1.5 bg-slate-900/90 p-1.5 rounded-xl border border-slate-800 flex-wrap">
        <button id="tab-trace" onclick="loadTab('trace.html', this, 'desktop')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow-md">
          ✨ 1. Fixed Trace (Кривая Безье)
        </button>
        <button id="tab-porthole" onclick="loadTab('porthole.html', this, 'desktop')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">
          💡 2. Porthole Spotlight
        </button>
        <button id="tab-site" onclick="loadTab('site.html', this, 'mobile')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">
          📱 3. Сайт мастера (Скретч-карта)
        </button>
        <button id="tab-presentation" onclick="loadTab('presentation.html', this, 'desktop')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">
          🖥 4. React Canvas
        </button>
      </nav>

      <!-- Mode Switcher & Direct Link -->
      <div class="flex items-center gap-2">
        <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-800 text-xs">
          <button id="btn-desktop" onclick="setDevice('desktop')" class="px-2.5 py-1 rounded font-bold text-white bg-slate-800 transition-colors">💻 Десктоп</button>
          <button id="btn-mobile" onclick="setDevice('mobile')" class="px-2.5 py-1 rounded text-slate-400 hover:text-white transition-colors">📱 Смартфон</button>
        </div>
        <a id="open-direct-link" href="trace.html" target="_blank" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition-colors flex items-center gap-1 border border-slate-700">
          <span>Во весь экран</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        </a>
      </div>

    </div>
  </header>

  <!-- Sub-info Banner -->
  <div class="bg-slate-900/60 border-b border-slate-800/60 px-4 py-2 text-xs text-slate-400 flex items-center justify-between">
    <div class="max-w-7xl mx-auto w-full flex items-center justify-between">
      <span id="current-file-label">Текущий файл: <b>trace.html</b> — Презентация со связанной плавной линией TRACE</span>
      <span class="text-[11px] text-slate-500">Интерактивный просмотрщик</span>
    </div>
  </div>

  <!-- Stage Frame -->
  <main class="flex-1 p-3 flex flex-col items-center justify-center bg-[#070A12]">
    <div id="frame-box" class="device-desktop">
      <iframe id="preview-frame" src="trace.html"></iframe>
    </div>
  </main>

  <script>
    let currentMode = 'desktop';
    let currentUrl = 'trace.html';

    const labelMap = {
      'trace.html': 'trace.html — Презентация с плавной пунктирной кривой TRACE (Кривая Безье)',
      'porthole.html': 'porthole.html — Презентация с оптическим иллюминатором и прожектором',
      'site.html': 'site.html — Мобильный интерфейс мастера: стирание защитного скретч-слоя пальцем/монетой',
      'presentation.html': 'presentation.html — Интерактивный React Artifact (Canvas)'
    };

    function loadTab(url, btnEl, preferredMode) {
      currentUrl = url;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = 'tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all';
      });
      btnEl.className = 'tab-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow-md';

      document.getElementById('preview-frame').src = url;
      document.getElementById('open-direct-link').href = url;
      document.getElementById('current-file-label').innerHTML = 'Текущий файл: <b>' + url + '</b> — ' + (labelMap[url] || '');

      if (preferredMode) {
        setDevice(preferredMode);
      }
    }

    function setDevice(mode) {
      currentMode = mode;
      const frameBox = document.getElementById('frame-box');
      const btnDesk = document.getElementById('btn-desktop');
      const btnMob = document.getElementById('btn-mobile');

      if (mode === 'mobile') {
        frameBox.className = 'device-mobile';
        btnMob.className = 'px-2.5 py-1 rounded font-bold text-white bg-slate-800 transition-colors';
        btnDesk.className = 'px-2.5 py-1 rounded text-slate-400 hover:text-white transition-colors';
      } else {
        frameBox.className = 'device-desktop';
        btnDesk.className = 'px-2.5 py-1 rounded font-bold text-white bg-slate-800 transition-colors';
        btnMob.className = 'px-2.5 py-1 rounded text-slate-400 hover:text-white transition-colors';
      }
    }
  </script>
</body>
</html>
